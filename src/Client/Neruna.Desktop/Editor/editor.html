<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<!-- Scripts only with our nonce: inline event handlers in quoted or pasted HTML can never run. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: blob: https: http:; style-src 'unsafe-inline'; font-src data:; script-src 'nonce-neruna-editor'">
<style>
  html, body { margin: 0; height: 100%; background: #ffffff; }
  #editor {
    min-height: 100%; box-sizing: border-box; padding: 14px 18px 40px; outline: none;
    color: #000000; word-wrap: break-word; overflow-wrap: anywhere; line-height: 1.3;
  }
  /* Lines inside a block (signature, quoted original) stay together; a paragraph of its own (Enter) gets half a line
     more (Einstellungen → Schreiben), so it stands apart from lines that merely wrap. cleanHtml puts the same margin
     into the sent mail. */
  #editor div, #editor p { margin: 0; }
  #editor > div, #editor > p { margin: 0 0 var(--paragraph-spacing, 0.5em) 0; }
  /* Lists start where the text starts: the bullet (or number) at the left edge, its text just after; only nested lists
     (Tab) are indented. cleanHtml puts the same into the sent mail, whose program would otherwise indent them. */
  #editor ul, #editor ol { margin: 0; padding-left: 1.3em; }
  #editor ol { padding-left: 1.8em; }
  #editor > ul, #editor > ol { margin: 0 0 var(--paragraph-spacing, 0.5em) 0; }
  /* The line above a list ("Erbschaft Mutter:") belongs to it: no gap in between, whether the browser keeps the list
     inside that line's block or puts it next to it (which deleting an empty line above can change). The negative
     margin cancels the line's own spacing; cleanHtml sets it to 0 in the sent mail. */
  #editor > div + ul, #editor > div + ol, #editor > p + ul, #editor > p + ol { margin-top: calc(-1 * var(--paragraph-spacing, 0.5em)); }
  #editor blockquote { margin: 0 0 0 4px; padding-left: 10px; border-left: 2px solid #c8c8c8; }
  #editor img { max-width: 100%; }
  /* A fine frame around pictures while writing, so white or transparent ones can be seen (not sent: CSS of the editor). */
  #editor img { outline: 1px solid rgba(0, 0, 0, 0.22); outline-offset: 0; }
  /* An empty cell (a form from a text template) stays wide enough to click into. */
  #editor td, #editor th { min-width: 3em; }
  #editor a { color: #0f6cbd; }
  /* Checklists (notes): a box in front of each item, clicked to tick it. Ticked items are struck through inline, so
     other programs show them as done too; elsewhere the list is an ordinary bulleted list. */
  #editor ul.neruna-checklist { list-style: none; padding-left: 0.3em; }
  #editor ul.neruna-checklist > li { position: relative; padding-left: 1.7em; }
  #editor ul.neruna-checklist > li::before {
    content: ""; position: absolute; left: 0; top: 0.15em; width: 0.95em; height: 0.95em; box-sizing: border-box;
    border: 1.5px solid #6b6b6b; border-radius: 3px; background: #ffffff; cursor: pointer;
  }
  #editor ul.neruna-checklist > li[data-checked="true"]::before {
    content: "✓"; background: #0f6cbd; border-color: #0f6cbd; color: #ffffff; font: bold 0.75em/1.25em sans-serif; text-align: center;
  }
  #editor:empty::before { content: attr(data-placeholder); color: #8a8a8a; }
  /* Dark theme: the page is shown inverted (so quoted mails with their own colours turn dark too), pictures are turned
     back. The mail itself is not changed – it is sent as written, dark text on white. */
  html.dark { filter: invert(1) hue-rotate(180deg); }
  html.dark, html.dark body { background: #d6d6d6; }
  html.dark img, html.dark video, html.dark [style*="background-image"] { filter: invert(1) hue-rotate(180deg); }
  /* The picture being resized: a frame and a grip at its corner. They live outside #editor – never part of the mail. */
  #neruna-image-frame { position: absolute; display: none; pointer-events: none; border: 1px solid #0f6cbd; box-sizing: border-box; }
  #neruna-image-grip { position: absolute; display: none; width: 12px; height: 12px; background: #0f6cbd; border: 2px solid #ffffff;
                       box-sizing: border-box; cursor: nwse-resize; touch-action: none; }
  /* Linux: the caret Neruna draws itself (see drawCaret) – outside #editor, never part of the mail. */
  #neruna-caret { position: absolute; display: none; width: 1px; background: #000000; pointer-events: none; animation: neruna-blink 1s steps(1) infinite; }
  @keyframes neruna-blink { 50% { opacity: 0; } }
  #neruna-image-size { position: absolute; display: none; padding: 1px 5px; background: #0f6cbd; color: #ffffff;
                       font: 11px sans-serif; border-radius: 3px; pointer-events: none; white-space: nowrap; }
</style>
</head>
<body>
<div id="editor" contenteditable="true" spellcheck="true" data-placeholder=""></div>
<script nonce="neruna-editor">
(function () {
  "use strict";
  var editor = document.getElementById("editor");
  var lastState = "";
  var stateTimer = 0;

  // Shortly after each change (and when the text loses focus) the HTML goes to the app too: if the page is
  // unloaded (switching to the calendar), what was typed is not lost.
  var htmlTimer = null;
  function postHtml() {
    clearTimeout(htmlTimer);
    htmlTimer = null;
    if (window.neruna && window.neruna.getHtml) post({ type: "html", html: window.neruna.getHtml() });
  }

  editor.addEventListener("blur", function () { if (htmlTimer) postHtml(); });

  function post(message) {
    if (message.type === "changed") {
      clearTimeout(htmlTimer);
      htmlTimer = setTimeout(postHtml, 300);
    }
    if (typeof window.invokeCSharpAction === "function") {
      window.invokeCSharpAction(JSON.stringify(message));
    } else if (typeof window.__nerunaTestSink === "function") {
      window.__nerunaTestSink(message);
    }
  }

  function selectionElement() {
    var selection = window.getSelection();
    if (!selection || selection.rangeCount === 0) return editor;
    var node = selection.getRangeAt(0).startContainer;
    if (node.nodeType === Node.TEXT_NODE) node = node.parentNode;
    return editor.contains(node) ? node : editor;
  }

  function toHex(rgb) {
    var m = /rgba?\((\d+),\s*(\d+),\s*(\d+)/.exec(rgb || "");
    if (!m) return "#000000";
    return "#" + [m[1], m[2], m[3]].map(function (v) { return ("0" + parseInt(v, 10).toString(16)).slice(-2); }).join("");
  }

  function firstFamily(family) {
    return (family || "").split(",")[0].trim().replace(/^["']|["']$/g, "");
  }

  function reportState() {
    var el = selectionElement();
    var style = window.getComputedStyle(el);
    var state = {
      type: "state",
      bold: document.queryCommandState("bold"),
      italic: document.queryCommandState("italic"),
      underline: document.queryCommandState("underline"),
      strikethrough: document.queryCommandState("strikeThrough"),
      bulletList: document.queryCommandState("insertUnorderedList") && !checklistAt(el),
      checklist: !!checklistAt(el),
      numberedList: document.queryCommandState("insertOrderedList"),
      font: firstFamily(style.fontFamily),
      size: Math.round(parseFloat(style.fontSize) * 0.75 * 2) / 2,
      color: toHex(style.color)
    };
    var json = JSON.stringify(state);
    if (json !== lastState) {
      lastState = json;
      post(state);
    }
  }

  function scheduleState() {
    clearTimeout(stateTimer);
    stateTimer = setTimeout(reportState, 40);
  }

  // Wraps the selection (or, at a caret, the text typed next) in a span with one inline style.
  function applyStyle(property, value) {
    editor.focus();
    var selection = window.getSelection();
    if (!selection || selection.rangeCount === 0) return;
    var range = selection.getRangeAt(0);

    if (range.collapsed) {
      var span = document.createElement("span");
      span.style.setProperty(property, value);
      span.appendChild(document.createTextNode("​"));
      range.insertNode(span);
      var caret = document.createRange();
      caret.setStart(span.firstChild, 1);
      caret.collapse(true);
      selection.removeAllRanges();
      selection.addRange(caret);
    } else {
      // execCommand keeps undo working; the marker size is then replaced by the real value.
      document.execCommand("styleWithCSS", false, true);
      document.execCommand("fontSize", false, "7");
      var marked = editor.querySelectorAll('span[style*="xx-large"], font[size="7"]');
      for (var i = 0; i < marked.length; i++) {
        var el = marked[i];
        if (el.tagName === "FONT") {
          var replacement = document.createElement("span");
          while (el.firstChild) replacement.appendChild(el.firstChild);
          el.parentNode.replaceChild(replacement, el);
          el = replacement;
        }
        el.style.removeProperty("font-size");
        el.style.setProperty(property, value);
      }
    }
    scheduleState();
    post({ type: "changed" });
  }

  function checklistAt(el) {
    var list = el && el.closest ? el.closest("ul") : null;
    return list && editor.contains(list) && list.classList.contains("neruna-checklist") ? list : null;
  }

  function setChecked(li, on) {
    li.setAttribute("data-checked", on ? "true" : "false");
    li.style.textDecoration = on ? "line-through" : "";
    li.style.color = on ? "#808080" : "";
    if (!li.getAttribute("style")) li.removeAttribute("style");
  }

  // The current lines become a checklist (a bulleted list becomes one); in a checklist the lines become text again.
  function toggleChecklist() {
    editor.focus();
    var el = selectionElement();
    if (checklistAt(el)) {
      document.execCommand("insertUnorderedList", false, null);
    } else {
      var list = el.closest ? el.closest("ul") : null;
      if (!list || !editor.contains(list)) {
        document.execCommand("insertUnorderedList", false, null);
        el = selectionElement();
        list = el.closest ? el.closest("ul") : null;
      }
      if (list && editor.contains(list)) {
        list.classList.add("neruna-checklist");
        Array.prototype.forEach.call(list.children, function (li) { if (!li.hasAttribute("data-checked")) setChecked(li, false); });
      }
    }
    scheduleState();
    post({ type: "changed" });
  }

  // A click on an item's box ticks it (or not); the caret stays where it was.
  editor.addEventListener("mousedown", function (e) {
    var li = e.target && e.target.closest ? e.target.closest("li") : null;
    if (!li || !checklistAt(li) || li.parentNode !== checklistAt(li)) return;
    if (e.clientX - li.getBoundingClientRect().left > parseFloat(window.getComputedStyle(li).paddingLeft)) return;
    e.preventDefault();
    setChecked(li, li.getAttribute("data-checked") !== "true");
    post({ type: "changed" });
  });

  function exec(command, value) {
    if (command === "checklist") { toggleChecklist(); return; }
    editor.focus();
    document.execCommand("styleWithCSS", false, true);
    document.execCommand(command, false, value === undefined ? null : value);
    scheduleState();
    post({ type: "changed" });
  }

  function cleanHtml() {
    var clone = editor.cloneNode(true);
    // Zero-width placeholders from caret formatting and empty styling spans are not part of the mail.
    var walker = document.createTreeWalker(clone, NodeFilter.SHOW_TEXT, null);
    var texts = [];
    while (walker.nextNode()) texts.push(walker.currentNode);
    texts.forEach(function (t) { t.nodeValue = t.nodeValue.replace(/​/g, ""); });
    Array.prototype.slice.call(clone.querySelectorAll("span")).forEach(function (s) {
      if (!s.textContent && !s.querySelector("img,br")) s.parentNode.removeChild(s);
    });
    // The paragraph spacing travels with the mail (inline, which every mail program understands).
    Array.prototype.slice.call(clone.children).forEach(function (el) {
      if ((el.tagName === "DIV" || el.tagName === "P") && !el.style.margin && !el.style.marginBottom) {
        var next = el.nextElementSibling;
        el.style.margin = "0 0 " + (next && (next.tagName === "UL" || next.tagName === "OL") ? "0" : paragraphSpacing) + " 0";
      }
    });
    Array.prototype.slice.call(clone.querySelectorAll("ul, ol")).forEach(function (list) {
      if (list.classList.contains("neruna-checklist") || list.style.paddingLeft || list.style.marginLeft) return;
      list.style.marginTop = "0";
      list.style.marginLeft = "0";
      list.style.marginBottom = list.parentNode === clone ? paragraphSpacing : "0";
      list.style.paddingLeft = list.tagName === "OL" ? "1.8em" : "1.3em";
    });
    return clone.innerHTML;
  }

  editor.addEventListener("keydown", function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key === "Enter") {
      e.preventDefault();
      post({ type: "send" });
    } else if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) {
      e.preventDefault();
      post({ type: "save" });
    } else if (e.key === "Tab" && !e.ctrlKey && !e.altKey && !e.shiftKey && expandShortcut("")) {
      // "tel" + Tab: the template, if "tel" is a shortcut; otherwise Tab as always (next cell, indent).
      e.preventDefault();
    } else if (e.key === "Tab" && !e.ctrlKey && !e.altKey && currentCell()) {
      e.preventDefault();
      nextCell(currentCell(), e.shiftKey ? -1 : 1);
    } else if (e.key === "Tab" && !e.ctrlKey && !e.altKey) {
      e.preventDefault();
      exec(e.shiftKey ? "outdent" : "insertText", e.shiftKey ? undefined : "    ");
    }
  });

  // Pasted bitmaps become inline images (sent as embedded attachments).
  // Files dragged in from outside: the app decides what happens (attach, link, ask); the page never opens them.
  // WebView2 hands the real files (with their paths) to the app; elsewhere file:// URIs or, failing that, the content.
  var dragPing = 0;
  var dropRange = null;
  var droppedFiles = null;
  function hasFiles(e) {
    var types = e.dataTransfer && e.dataTransfer.types;
    return !!types && Array.prototype.indexOf.call(types, "Files") >= 0;
  }
  function onDragOver(e) {
    if (!hasFiles(e)) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "copy";
    var now = Date.now();
    // Every few hundred ms while dragging: the app looks which mouse button is held (right: ask after dropping).
    if (now - dragPing > 150) {
      post({ type: "dragging", restart: now - dragPing > 1000 });
      dragPing = now;
    }
  }
  document.addEventListener("dragenter", onDragOver);
  document.addEventListener("dragover", onDragOver);
  document.addEventListener("drop", function (e) {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragPing = 0;
    var range = document.caretRangeFromPoint ? document.caretRangeFromPoint(e.clientX, e.clientY) : null;
    dropRange = range && editor.contains(range.commonAncestorContainer) ? range : null;
    droppedFiles = e.dataTransfer.files;
    var uris = (e.dataTransfer.getData("text/uri-list") || "").split(/\r?\n/).filter(function (u) { return /^file:/i.test(u); });
    var message = { type: "filedrop", ctrl: e.ctrlKey, x: e.clientX, y: e.clientY, uris: uris, count: droppedFiles.length };
    var webview = window.chrome && window.chrome.webview;
    if (webview && typeof webview.postMessageWithAdditionalObjects === "function") {
      webview.postMessageWithAdditionalObjects(JSON.stringify(message), droppedFiles);
    } else {
      post(message);
    }
  });

  // Files copied in the file manager (Ctrl+C, then Ctrl+V here): the app looks at its clipboard and attaches them.
  // Only when there is no file behind them (a screenshot) a picture goes into the text. Text from Word or a spreadsheet
  // (HTML, often with a picture of it besides) is pasted as before.
  var pastedFiles = null;
  editor.addEventListener("paste", function (e) {
    var data = e.clipboardData;
    if (!data || (typeof window.invokeCSharpAction !== "function" && typeof window.__nerunaTestSink !== "function")) return;
    var types = Array.prototype.slice.call(data.types || []);
    var uris = (data.getData("text/uri-list") || "").split(/\r?\n/).filter(function (u) { return /^file:/i.test(u); });
    var files = Array.prototype.filter.call(data.items || [], function (i) { return i.kind === "file"; })
      .map(function (i) { return i.getAsFile(); }).filter(function (f) { return !!f; });
    var hasText = types.indexOf("text/html") >= 0 || types.indexOf("text/plain") >= 0;
    // Nothing in the page's view of the clipboard (some systems hide copied files from it): ask the app as well.
    if (uris.length === 0 && (hasText || (files.length === 0 && types.length > 0))) return;
    e.preventDefault();
    e.stopImmediatePropagation();
    pastedFiles = files;
    post({ type: "filepaste", uris: uris, count: files.length });
  });

  editor.addEventListener("paste", function (e) {
    if (e.defaultPrevented) return;
    var items = (e.clipboardData && e.clipboardData.items) || [];
    for (var i = 0; i < items.length; i++) {
      if (items[i].kind === "file" && /^image\//.test(items[i].type)) {
        e.preventDefault();
        var reader = new FileReader();
        reader.onload = function () {
          // Neruna checks the size first (a screenshot of a 4K screen would make every mail huge).
          if (typeof window.invokeCSharpAction === "function") post({ type: "image", data: reader.result });
          else exec("insertHTML", '<img src="' + reader.result + '">');
        };
        reader.readAsDataURL(items[i].getAsFile());
        return;
      }
    }
  });

  // Text typed into an empty editor lands outside any block; wrap such runs in a div, so the first line is a
  // paragraph like the others (spacing in the editor and in the sent mail). The caret stays where it was.
  var BLOCKS = /^(DIV|P|BLOCKQUOTE|UL|OL|TABLE|PRE|H[1-6]|HR)$/;
  function ensureBlocks() {
    var loose = Array.prototype.filter.call(editor.childNodes, function (n) {
      return n.nodeType === 3 ? n.nodeValue.length > 0 : n.nodeType === 1 && !BLOCKS.test(n.tagName);
    });
    if (loose.length === 0) return;
    var selection = window.getSelection();
    var anchor = selection.rangeCount ? { node: selection.anchorNode, offset: selection.anchorOffset } : null;
    var block = null;
    Array.prototype.slice.call(editor.childNodes).forEach(function (n) {
      if (loose.indexOf(n) >= 0) {
        if (!block) { block = document.createElement("div"); editor.insertBefore(block, n); }
        block.appendChild(n);
      } else {
        block = null;
      }
    });
    if (anchor && anchor.node && editor.contains(anchor.node)) selection.collapse(anchor.node, anchor.offset);
  }

  // Tables (forms from text templates): Tab goes to the next cell, Shift+Tab back; Tab in the last cell adds a row.
  function currentCell() {
    var selection = window.getSelection();
    if (!selection || selection.rangeCount === 0) return null;
    var node = selection.getRangeAt(0).startContainer;
    var el = node.nodeType === 1 ? node : node.parentNode;
    var cell = el && el.closest ? el.closest("td, th") : null;
    return cell && editor.contains(cell) ? cell : null;
  }

  function caretInto(cell) {
    var block = cell.lastElementChild && /^(P|DIV)$/.test(cell.lastElementChild.nodeName) ? cell.lastElementChild : cell;
    var range = document.createRange();
    if (block.textContent.replace(/[\s\u00a0\u200b]/g, "") === "") range.setStart(block, 0);
    else { range.selectNodeContents(block); range.collapse(false); }
    var selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
  }

  function nextCell(cell, step) {
    var table = cell.closest("table");
    var cells = Array.prototype.filter.call(table.querySelectorAll("td, th"), function (c) { return c.closest("table") === table; });
    var index = cells.indexOf(cell) + step;
    if (index < 0) return;
    if (index >= cells.length) {
      var row = cell.closest("tr").cloneNode(true);
      Array.prototype.forEach.call(row.children, function (c) { c.innerHTML = '<p style="margin: 0"><br></p>'; });
      cell.closest("tr").parentNode.appendChild(row);
      caretInto(row.firstElementChild);
      post({ type: "changed" });
      return;
    }
    caretInto(cells[index]);
  }

  /** insertHTML; a table that comes with it (a form) gets the caret in its first empty cell, ready to fill in. */
  function insertWithTables(html) {
    var before = Array.prototype.slice.call(editor.querySelectorAll("table"));
    document.execCommand("insertHTML", false, html);
    var added = Array.prototype.filter.call(editor.querySelectorAll("table"), function (t) { return before.indexOf(t) < 0; });
    if (added.length === 0) return;
    var empty = Array.prototype.filter.call(added[0].querySelectorAll("td, th"), function (c) {
      return c.textContent.replace(/[\s\u00a0\u200b]/g, "") === "" && !c.querySelector("img");
    })[0];
    if (empty) caretInto(empty);
  }

  // Text template shortcuts: "tel::" typed, or "tel" and Tab, becomes the template (set by the app, case-insensitive).
  var shortcuts = {};
  var expanding = false;
  function expandShortcut(suffix) {
    var selection = window.getSelection();
    if (!selection || selection.rangeCount === 0) return false;
    var caret = selection.getRangeAt(0);
    if (!caret.collapsed || caret.startContainer.nodeType !== 3) return false;
    var before = caret.startContainer.nodeValue.slice(0, caret.startOffset);
    var match = (suffix === "::" ? /(?:^|[^\p{L}\p{N}_-])([\p{L}\p{N}_-]+)::$/u : /(?:^|[^\p{L}\p{N}_-])([\p{L}\p{N}_-]+)$/u).exec(before);
    if (!match) return false;
    var html = shortcuts[match[1].toLowerCase()];
    if (html === undefined) return false;
    var range = document.createRange();
    range.setStart(caret.startContainer, caret.startOffset - match[1].length - suffix.length);
    range.setEnd(caret.startContainer, caret.startOffset);
    selection.removeAllRanges();
    selection.addRange(range);
    expanding = true;
    try { insertWithTables(html); } finally { expanding = false; }
    return true;
  }

  // Automatic lists (Einstellungen → Schreiben): "- " or "* " at the start of a line becomes a bulleted list,
  // "1. " a numbered one. Not inside a list or a table cell; Ctrl+Z undoes it.
  var autoLists = true;
  var paragraphSpacing = "0.5em";
  function autoList() {
    var selection = window.getSelection();
    if (!selection || selection.rangeCount === 0) return;
    var caret = selection.getRangeAt(0);
    if (!caret.collapsed) return;
    var node = caret.startContainer;
    var block = node.nodeType === 1 ? node : node.parentNode;
    while (block && block !== editor && !/^(P|DIV|LI|TD|TH|BLOCKQUOTE|H[1-6])$/.test(block.nodeName)) block = block.parentNode;
    if (!block || /^(LI|TD|TH)$/.test(block.nodeName) || (block !== editor && block.closest && block.closest("li, td, th"))) return;
    var start = document.createRange();
    start.setStart(block === editor ? editor : block, 0);
    start.setEnd(caret.startContainer, caret.startOffset);
    var typed = start.toString();
    var match = /^[\s\u00a0]*(?:([-*•])|(1[.)]))[\s\u00a0]$/.exec(typed);
    if (!match) return;
    // Through the editor's own commands, so Ctrl+Z undoes the list and then brings the typed characters back.
    selection.removeAllRanges();
    selection.addRange(start);
    document.execCommand("delete", false, null);
    exec(match[1] ? "insertUnorderedList" : "insertOrderedList");
  }

  // Web addresses become links by themselves: typed (on the space or Enter after them) or pasted as plain text.
  // Trailing punctuation belongs to the sentence ("siehe https://neruna.org."). Ctrl+Z takes the link back.
  var URL_AT_END = /(?:^|[\s\u00a0(\[<"'])((?:https?:\/\/|www\.)[^\s\u00a0<>"]*[^\s\u00a0<>".,;:!?)\]'])([.,;:!?)\]']*)$/i;
  var URL_ANY = /(?:https?:\/\/|www\.)[^\s\u00a0<>"]*[^\s\u00a0<>".,;:!?)\]']/gi;
  function hrefOf(text) { return /^www\./i.test(text) ? "https://" + text : text; }
  function insideLink(node) {
    var el = node && (node.nodeType === 1 ? node : node.parentNode);
    return !!(el && el.closest && el.closest("a"));
  }
  function escapeHtml(text) {
    return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  // Links the address that ends (but for punctuation) at offset in the text node; the caret goes after the
  // punctuation, outside the link, so typing on does not extend it. True if it made a link.
  function linkBefore(node, offset) {
    if (!node || node.nodeType !== 3 || insideLink(node)) return false;
    var before = node.nodeValue.slice(0, offset);
    var match = URL_AT_END.exec(before);
    if (!match) return false;
    var start = before.length - match[2].length - match[1].length;
    var range = document.createRange();
    range.setStart(node, start);
    range.setEnd(node, start + match[1].length);
    var href = hrefOf(match[1]);
    var selection = window.getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    document.execCommand("createLink", false, href);
    // The new link: the one the selection still touches (the engines leave it in different places).
    var touched = selection.rangeCount ? selection.getRangeAt(0) : null;
    var link = touched ? Array.prototype.filter.call(editor.querySelectorAll("a"), function (a) {
      return a.getAttribute("href") === href && touched.intersectsNode(a);
    })[0] : null;
    var caret = document.createRange();
    if (link && link.nextSibling && link.nextSibling.nodeType === 3 && link.nextSibling.nodeValue.length >= match[2].length) {
      caret.setStart(link.nextSibling, match[2].length);
    } else if (link) {
      caret.setStartAfter(link);
    } else {
      return false;
    }
    caret.collapse(true);
    selection.removeAllRanges();
    selection.addRange(caret);
    return true;
  }
  function caretText() {
    var selection = window.getSelection();
    if (!selection || selection.rangeCount === 0) return null;
    var caret = selection.getRangeAt(0);
    return caret.collapsed && caret.startContainer.nodeType === 3 ? caret : null;
  }
  // After a typed space: the address before it (the space itself stays outside the link).
  function autoLinkTyped() {
    var caret = caretText();
    if (!caret || caret.startOffset === 0) return;
    var node = caret.startContainer, offset = caret.startOffset;
    if (!linkBefore(node, offset - 1)) return;
    // The caret now sits before the space: put it back after it.
    var selection = window.getSelection();
    var at = selection.getRangeAt(0);
    if (at.startContainer.nodeType === 3 && /^[\s\u00a0]/.test(at.startContainer.nodeValue.slice(at.startOffset))) {
      var after = document.createRange();
      after.setStart(at.startContainer, at.startOffset + 1);
      after.collapse(true);
      selection.removeAllRanges();
      selection.addRange(after);
    }
  }
  editor.addEventListener("keydown", function (e) {
    // Before Enter splits the line: the address before the caret.
    if (e.key === "Enter" && !e.ctrlKey && !e.metaKey && !e.altKey && !e.isComposing) {
      var caret = caretText();
      if (caret) linkBefore(caret.startContainer, caret.startOffset);
    }
  }, true);
  // Plain text with addresses (e.g. copied from the address bar): pasted with links. Only an address onto a
  // selection: the selected text becomes the link. Pasted HTML keeps its own links.
  editor.addEventListener("paste", function (e) {
    if (e.defaultPrevented || !e.clipboardData) return;
    if (Array.prototype.some.call(e.clipboardData.types || [], function (t) { return t === "text/html" || t === "Files"; })) return;
    var text = e.clipboardData.getData("text/plain");
    URL_ANY.lastIndex = 0;
    if (!text || !URL_ANY.test(text)) return;
    var selection = window.getSelection();
    if (!selection || selection.rangeCount === 0 || insideLink(selection.getRangeAt(0).commonAncestorContainer)) return;
    e.preventDefault();
    var single = text.trim();
    URL_ANY.lastIndex = 0;
    var whole = URL_ANY.exec(single);
    if (!selection.getRangeAt(0).collapsed && whole && whole[0] === single) {
      exec("createLink", hrefOf(single));
      return;
    }
    var html = "", last = 0, m;
    URL_ANY.lastIndex = 0;
    while ((m = URL_ANY.exec(text)) !== null) {
      html += escapeHtml(text.slice(last, m.index)) + '<a href="' + escapeHtml(hrefOf(m[0])) + '">' + escapeHtml(m[0]) + "</a>";
      last = m.index + m[0].length;
    }
    html += escapeHtml(text.slice(last));
    exec("insertHTML", html.replace(/\r?\n/g, "<br>"));
  });

  editor.addEventListener("input", function (e) {
    if (!expanding && e.inputType === "insertText" && (e.data === " " || e.data === "\u00a0")) autoLinkTyped();
    if (!expanding && e.inputType === "insertText" && e.data === ":") expandShortcut("::");
    if (autoLists && !expanding && e.inputType === "insertText" && e.data === " ") autoList();
    // A new item (Enter) in a checklist starts unticked, also after a ticked one.
    var item = selectionElement().closest ? selectionElement().closest("li") : null;
    if (item && checklistAt(item) && (!item.hasAttribute("data-checked") || (e.inputType === "insertParagraph" && !item.textContent.trim()))) setChecked(item, false);
    ensureBlocks(); post({ type: "changed" }); scheduleState();
  });
  document.addEventListener("selectionchange", scheduleState);

  // The last caret position in the text: a text template chosen from a menu outside the page goes exactly there.
  var lastRange = null;
  document.addEventListener("selectionchange", function () {
    var selection = window.getSelection();
    if (selection && selection.rangeCount > 0 && editor.contains(selection.getRangeAt(0).commonAncestorContainer)) {
      lastRange = selection.getRangeAt(0).cloneRange();
    }
  });

  // The drawn caret (Linux, see neruna.drawCaret): a thin line where the collapsed selection is, blinking anew after
  // each move. An empty line has no text to measure: then the line box of its element gives the place.
  var drawnCaret = null;
  function placeCaret() {
    if (!drawnCaret) return;
    var selection = window.getSelection();
    var focused = document.activeElement === editor || editor.contains(document.activeElement);
    if (!focused || !selection || selection.rangeCount === 0 || !selection.isCollapsed || !editor.contains(selection.anchorNode)) {
      drawnCaret.style.display = "none";
      return;
    }

    var range = selection.getRangeAt(0);
    var rects = range.getClientRects();
    var left, top, height;
    if (rects.length > 0) {
      var rect = rects[rects.length - 1];
      left = rect.left; top = rect.top; height = rect.height;
    } else {
      var node = range.startContainer.nodeType === Node.TEXT_NODE ? range.startContainer.parentNode : range.startContainer;
      if (node === editor && editor.childNodes[range.startOffset] && editor.childNodes[range.startOffset].nodeType === 1) node = editor.childNodes[range.startOffset];
      var box = node.getBoundingClientRect();
      var style = window.getComputedStyle(node);
      var line = parseFloat(style.lineHeight) || parseFloat(style.fontSize) * 1.3;
      left = box.left + (parseFloat(style.paddingLeft) || 0) + (parseFloat(style.borderLeftWidth) || 0);
      top = box.top + (parseFloat(style.paddingTop) || 0) + (parseFloat(style.borderTopWidth) || 0);
      height = line;
    }

    drawnCaret.style.left = (left + window.scrollX) + "px";
    drawnCaret.style.top = (top + window.scrollY) + "px";
    drawnCaret.style.height = Math.max(height, 10) + "px";
    drawnCaret.style.display = "block";
    drawnCaret.style.animation = "none";
    void drawnCaret.offsetWidth; // restart the blink: visible right after typing or moving
    drawnCaret.style.animation = "";
  }

  // Links are never followed inside the editor.
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a");
    if (a) e.preventDefault();
  });

  // ---- Resizing pictures: click one, drag the grip at its corner; the proportions always stay ----------------------
  var imageFrame = document.createElement("div");
  imageFrame.id = "neruna-image-frame";
  var imageGrip = document.createElement("div");
  imageGrip.id = "neruna-image-grip";
  var imageSize = document.createElement("div");
  imageSize.id = "neruna-image-size";
  document.body.appendChild(imageFrame);
  document.body.appendChild(imageGrip);
  document.body.appendChild(imageSize);
  var selectedImage = null;

  function placeImageFrame() {
    if (!selectedImage || !editor.contains(selectedImage)) {
      selectedImage = null;
      imageFrame.style.display = imageGrip.style.display = imageSize.style.display = "none";
      return;
    }
    var r = selectedImage.getBoundingClientRect();
    var x = r.left + window.scrollX, y = r.top + window.scrollY;
    imageFrame.style.left = x + "px"; imageFrame.style.top = y + "px";
    imageFrame.style.width = r.width + "px"; imageFrame.style.height = r.height + "px";
    imageGrip.style.left = (x + r.width - 7) + "px"; imageGrip.style.top = (y + r.height - 7) + "px";
    imageSize.textContent = Math.round(r.width) + " × " + Math.round(r.height) + " px";
    imageSize.style.left = x + "px"; imageSize.style.top = (y + r.height + 4) + "px";
    imageFrame.style.display = imageGrip.style.display = imageSize.style.display = "block";
  }

  function setImageWidth(img, width) {
    var ratio = img.naturalWidth ? img.naturalHeight / img.naturalWidth : img.offsetHeight / Math.max(1, img.offsetWidth);
    var maxWidth = Math.max(16, editor.clientWidth - 36);
    var w = Math.max(16, Math.min(Math.round(width), maxWidth));
    var h = Math.max(1, Math.round(w * ratio));
    // Attributes for mail programs that ignore CSS, the style for the others; both always in proportion.
    img.setAttribute("width", w);
    img.setAttribute("height", h);
    img.style.width = w + "px";
    img.style.height = h + "px";
  }

  editor.addEventListener("click", function (e) {
    selectedImage = e.target && e.target.tagName === "IMG" ? e.target : null;
    placeImageFrame();
  });
  editor.addEventListener("input", placeImageFrame);
  window.addEventListener("resize", placeImageFrame);
  window.addEventListener("scroll", placeImageFrame);

  imageGrip.addEventListener("pointerdown", function (e) {
    if (!selectedImage) return;
    e.preventDefault();
    var img = selectedImage, startX = e.clientX, startWidth = img.getBoundingClientRect().width;
    imageGrip.setPointerCapture(e.pointerId);
    function move(ev) { setImageWidth(img, startWidth + ev.clientX - startX); placeImageFrame(); }
    function up() {
      imageGrip.removeEventListener("pointermove", move);
      imageGrip.removeEventListener("pointerup", up);
      imageGrip.removeEventListener("pointercancel", up);
      post({ type: "changed" });
    }
    imageGrip.addEventListener("pointermove", move);
    imageGrip.addEventListener("pointerup", up);
    imageGrip.addEventListener("pointercancel", up);
  });

  /**
   * The outermost element that starts with the marker (signature or quote) – so a block holding just the signature
   * goes with it. It stops where own text comes before: a draft that comes back from getHtml() (popped out, opened
   * again) has everything inside the font wrapper, and the wrapper itself must not count as the signature.
   */
  function blockOf(marker) {
    var node = marker;
    while (node.parentNode && node.parentNode !== editor && startsWith(node.parentNode, node)) node = node.parentNode;
    return node;
  }

  function startsWith(parent, child) {
    for (var n = parent.firstChild; n && n !== child; n = n.nextSibling) {
      if (n.nodeType === 1 && (n.tagName === "IMG" || n.querySelector("img") || n.textContent.replace(/[\s\u200B]/g, "") !== "")) return false;
      if (n.nodeType === 3 && n.nodeValue.replace(/[\s\u200B]/g, "") !== "") return false;
    }
    return true;
  }

  // AI: the user's own text runs from the start up to the signature or the quoted message, whichever comes first.
  function ownRange() {
    var range = document.createRange();
    range.setStart(editor, 0);
    var marker = editor.querySelector("#neruna-signature, #neruna-quote");
    if (marker) {
      range.setEndBefore(blockOf(marker));
    } else {
      range.setEnd(editor, editor.childNodes.length);
    }
    return range;
  }

  /** Plain text of a fragment: a line break for every <br> and block end. */
  function textOf(fragment) {
    var holder = document.createElement("div");
    holder.appendChild(fragment);
    Array.prototype.slice.call(holder.querySelectorAll("br")).forEach(function (br) { br.parentNode.replaceChild(document.createTextNode("\n"), br); });
    Array.prototype.slice.call(holder.querySelectorAll("div, p, li, tr, h1, h2, h3, blockquote")).forEach(function (b) { b.appendChild(document.createTextNode("\n")); });
    return holder.textContent.replace(/​/g, "").replace(/\n{3,}/g, "\n\n").trim();
  }

  /** The marked text (also after the focus moved to the app's buttons), or null. */
  function selectedRange() {
    var selection = window.getSelection();
    var range = selection && selection.rangeCount > 0 && editor.contains(selection.getRangeAt(0).commonAncestorContainer) ? selection.getRangeAt(0) : lastRange;
    return range && !range.collapsed && editor.contains(range.commonAncestorContainer) ? range : null;
  }

  window.neruna = {
    /** For the AI: own text, the quoted message and the marked text, as plain text (JSON). */
    texts: function () {
      var selected = selectedRange();
      var quote = editor.querySelector("#neruna-quote");
      var quoted = "";
      if (quote) {
        var range = document.createRange();
        range.setStartBefore(blockOf(quote));
        range.setEnd(editor, editor.childNodes.length);
        quoted = textOf(range.cloneContents());
      }
      return JSON.stringify({ own: textOf(ownRange().cloneContents()), quote: quoted, selection: selected ? textOf(selected.cloneContents()) : "" });
    },
    /** Replaces the marked text or the own text with html – as an edit, so Ctrl+Z brings the previous text back. */
    replaceText: function (html, selectionOnly) {
      var range = selectionOnly ? selectedRange() : ownRange();
      if (!range) return "none";
      editor.focus();
      var selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      insertWithTables(html);
      scheduleState();
      post({ type: "changed" });
      return "ok";
    },
    /** Loads content and the default font of the user (used for new text and the whole mail). */
    setDark: function (dark) { document.documentElement.classList.toggle("dark", !!dark); },
    setContent: function (html, font, sizePt, placeholder) {
      editor.style.fontFamily = font ? '"' + font + '", sans-serif' : "";
      editor.style.fontSize = sizePt ? sizePt + "pt" : "";
      editor.setAttribute("data-placeholder", placeholder || "");
      editor.innerHTML = html || "";
      selectedImage = null;
      placeImageFrame();
      document.execCommand("defaultParagraphSeparator", false, "div");
      var range = document.createRange();
      range.setStart(editor, 0);
      range.collapse(true);
      var selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(range);
      editor.focus();
      reportState();
      return "ok";
    },
    /** The body HTML, wrapped in the default font so recipients see what the user saw. */
    getHtml: function () {
      return '<div style="font-family: ' + editor.style.fontFamily.replace(/"/g, "'") + "; font-size: " + editor.style.fontSize + '; color: #000000;">' + cleanHtml() + "</div>";
    },
    /** Just the content, without the default-font wrapper (signatures: unformatted text follows the mail's font). */
    getBodyHtml: function () { return cleanHtml(); },
    isEmpty: function () { return editor.textContent.replace(/​/g, "").trim().length === 0 && !editor.querySelector("img"); },
    exec: exec,
    font: function (family) { exec("fontName", family); },
    size: function (pt) { applyStyle("font-size", pt + "pt"); },
    color: function (hex) { exec("foreColor", hex); },
    highlight: function (hex) { exec("hiliteColor", hex); },
    link: function (url) { exec("createLink", url); },
    /** Inserts an image (data: URI) at the caret, e.g. a logo for a signature. */
    insertImage: function (url) { exec("insertImage", url); },
    /** Shortcut → html of the text templates (see expandShortcut). */
    setShortcuts: function (map) {
      shortcuts = {};
      Object.keys(map || {}).forEach(function (key) { shortcuts[key.toLowerCase()] = map[key]; });
      return "ok";
    },
    setAutoLists: function (enabled) {
      autoLists = !!enabled;
      return "ok";
    },
    /** Space after a paragraph in lines (Einstellungen → Schreiben). */
    setParagraphSpacing: function (lines) {
      paragraphSpacing = (+lines || 0) + "em";
      editor.style.setProperty("--paragraph-spacing", paragraphSpacing);
      return "ok";
    },
    /** Inserts html where files were dropped (or at the caret, see insertHtml). */
    insertAtDrop: function (html) {
      if (dropRange && editor.contains(dropRange.commonAncestorContainer)) {
        lastRange = dropRange;
        window.getSelection().removeAllRanges();
      }
      dropRange = null;
      return window.neruna.insertHtml(html);
    },
    /** The dropped files' content, for attaching where the app gets no paths ({type:"filedata"} per file). */
    readDroppedFiles: function (maxBytes) {
      var files = droppedFiles ? Array.prototype.slice.call(droppedFiles) : [];
      droppedFiles = null;
      files.forEach(function (file) {
        if (file.size > maxBytes) {
          post({ type: "filedata", name: file.name, tooLarge: true });
          return;
        }
        var reader = new FileReader();
        reader.onload = function () { post({ type: "filedata", name: file.name, data: String(reader.result) }); };
        reader.onerror = function () { post({ type: "filedata", name: file.name, failed: true }); };
        reader.readAsDataURL(file);
      });
      return String(files.length);
    },
    /** Pasted files the app found no paths for: a picture (screenshot) into the text, anything else attached. */
    usePastedFiles: function (maxBytes) {
      var files = pastedFiles || [];
      pastedFiles = null;
      if (files.length > 0 && files.every(function (f) { return /^image\//.test(f.type); })) {
        files.forEach(function (file) {
          var reader = new FileReader();
          reader.onload = function () { post({ type: "image", data: reader.result }); };
          reader.readAsDataURL(file);
        });
        return String(files.length);
      }
      droppedFiles = files;
      return window.neruna.readDroppedFiles(maxBytes);
    },
    /** Inserts html at the last caret position (start of the text if there never was one); nothing is replaced. */
    insertHtml: function (html) {
      var selection = window.getSelection();
      // The current caret if it is in the text (most exact), else the remembered one.
      var range = selection && selection.rangeCount > 0 && editor.contains(selection.getRangeAt(0).commonAncestorContainer)
        ? selection.getRangeAt(0).cloneRange() : lastRange;
      editor.focus();
      if (!range || !editor.contains(range.commonAncestorContainer)) {
        range = document.createRange();
        range.setStart(editor, 0);
        range.collapse(true);
      }
      range.collapse(false);
      selection.removeAllRanges();
      selection.addRange(range);
      insertWithTables(html);
      scheduleState();
      post({ type: "changed" });
      return "ok";
    },
    /** Replaces the signature (the first #neruna-signature, always above a quote); empty html removes it. */
    setSignature: function (html) {
      var el = editor.querySelector("#neruna-signature");
      if (!el) {
        el = document.createElement("div");
        el.id = "neruna-signature";
        var spacer = document.createElement("div");
        spacer.innerHTML = "<br>";
        editor.insertBefore(el, editor.firstChild);
        editor.insertBefore(spacer, el);
      }
      el.innerHTML = html || "";
      post({ type: "changed" });
      return "ok";
    },
    /** Focus into the text; without a caret there yet (a fresh reply) at the very start, above signature and quote. */
    focus: function () {
      editor.focus();
      var selection = window.getSelection();
      if (!selection.rangeCount || !editor.contains(selection.getRangeAt(0).commonAncestorContainer)) {
        var range = document.createRange();
        range.setStart(editor.firstChild && editor.firstChild.nodeType === 1 ? editor.firstChild : editor, 0);
        range.collapse(true);
        selection.removeAllRanges();
        selection.addRange(range);
      }
      return "ok";
    },
    state: function () { lastState = ""; reportState(); return "ok"; },
    /** Linux: WebKitGTK in the app's web view gets the keys but draws no caret – Neruna draws one itself. */
    drawCaret: function (on) {
      if (!on || drawnCaret) return "ok";
      drawnCaret = document.createElement("div");
      drawnCaret.id = "neruna-caret";
      document.body.appendChild(drawnCaret);
      editor.style.caretColor = "transparent";
      // The view also moves the caret when the mouse only passes over the text, without a button down: such a move
      // is undone, the caret stays where the last click, key or Neruna put it. (Before placeCaret: it draws the result.)
      var hoverAt = 0, kept = null;
      document.addEventListener("mousemove", function (e) { hoverAt = e.buttons ? 0 : Date.now(); }, true);
      ["mousedown", "keydown", "compositionstart", "drop"].forEach(function (name) {
        document.addEventListener(name, function () { hoverAt = 0; }, true);
      });
      document.addEventListener("selectionchange", function () {
        var selection = window.getSelection();
        var now = selection.rangeCount > 0 ? selection.getRangeAt(0) : null;
        if (hoverAt && Date.now() - hoverAt < 200 && kept && editor.contains(kept.startContainer)) {
          if (!now || now.compareBoundaryPoints(Range.START_TO_START, kept) !== 0 || now.compareBoundaryPoints(Range.END_TO_END, kept) !== 0) {
            selection.removeAllRanges();
            selection.addRange(kept.cloneRange());
          }
          return;
        }
        if (now) kept = now.cloneRange();
      });
      ["selectionchange", "input", "focusin", "focusout"].forEach(function (name) { document.addEventListener(name, placeCaret); });
      window.addEventListener("scroll", placeCaret);
      window.addEventListener("resize", placeCaret);
      placeCaret();
      return "ok";
    }
  };

  post({ type: "ready" });
})();
</script>
</body>
</html>
