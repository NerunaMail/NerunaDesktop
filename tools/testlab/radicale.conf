# Radicale im Neruna-Testlabor: jedes Passwort, und jeder angemeldete Benutzer darf alle Kalender lesen/schreiben.
# Damit lassen sich Kalender anderer Benutzer testen, die (wie SOGo-Abos) nicht in der eigenen Liste erscheinen.
[server]
hosts = 0.0.0.0:5232

[auth]
type = none

[rights]
type = authenticated

[storage]
filesystem_folder = /data/collections
