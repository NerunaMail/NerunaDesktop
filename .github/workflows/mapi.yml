# Neruna's Simple MAPI DLL (native/mapi): compiled on every change, so a mistake shows before a release tag. The
# release (release.yml) builds it again into the Windows package.
name: MAPI

on:
  push:
    paths: ['native/mapi/**', '.github/workflows/mapi.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 gcc-mingw-w64-i686
      - name: Build
        run: |
          bash native/mapi/build.sh out
          ls -la out
          x86_64-w64-mingw32-objdump -p out/NerunaMapi64.dll | grep -A20 "Ordinal/Name Pointer" | head -25
          i686-w64-mingw32-objdump -p out/NerunaMapi32.dll | grep -A20 "Ordinal/Name Pointer" | head -25
