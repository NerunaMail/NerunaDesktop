# Neruna's Simple MAPI DLL (native/mapi): compiled on every change, so a mistake shows before a release tag. The
# release (release.yml) builds it again into the Windows package.
name: MAPI

on:
  push:
    paths: ['native/mapi/**', '.github/workflows/mapi.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 gcc-mingw-w64-i686
      - name: Build
        run: |
          # The compiler's messages as an annotation too (readable without access to the logs).
          if ! bash native/mapi/build.sh out > build.log 2>&1; then
            cat build.log
            echo "::error title=MAPI build::$(head -c 3500 build.log | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
            exit 1
          fi
          ls -la out
          # mapi32.dll looks the functions up by their plain names: no "_MAPISendMail@20" in the 32-bit one.
          for dll in "x86_64-w64-mingw32-objdump out/NerunaMapi64.dll" "i686-w64-mingw32-objdump out/NerunaMapi32.dll"; do
            exports=$($dll -p | sed -n '/Ordinal\/Name Pointer/,/^$/p')
            echo "$exports"
            for name in MAPILogon MAPILogoff MAPISendMail MAPISendMailW MAPISendDocuments MAPIResolveName MAPIFreeBuffer; do
              grep -qE "[[:space:]]$name[[:space:]]*\$" <<< "$exports" || { echo "::error title=MAPI exports::$name missing in ${dll##* }%0A$(sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g' <<< "$exports" | head -c 2500)"; exit 1; }
            done
          done
