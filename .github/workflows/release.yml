# Release: a tag like v0.1.2 builds the installers with Velopack and publishes them as one GitHub release – Windows
# (Setup.exe), Linux (AppImage) and macOS (Apple silicon and Intel). One job after the other, each adding its files.
# The installed app checks these releases for updates (Infrastructure/UpdateService.cs) and downloads only the
# changes (delta packages, made from the previous release). Built on Linux – the same way scripts/publish.sh does;
# vpk then defaults to the "linux" channel, so download/upload name the "win" channel that "[win] pack" creates.
name: Release

on:
  push:
    tags: ['v*']
    # A dry run: builds and packs every platform, publishes nothing (to try changes to this workflow).
    branches: [packaging-test]

permissions:
  contents: write

# Google's sign-in wants the desktop client's secret on the token request (not secret for an installed app, but it
# stays out of this public repository). MSBuild reads it as the property GoogleClientSecret; without it Google is off.
env:
  GoogleClientSecret: ${{ secrets.GOOGLE_DESKTOP_CLIENT_SECRET }}

jobs:
  windows:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      AVALONIA_TELEMETRY_OPTOUT: 1
      VPK_VERSION: 1.2.161
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version from the tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "VERSION=0.1.0-test" >> "$GITHUB_ENV"; fi

      - name: Tests
        run: dotnet test

      - name: Build
        run: |
          dotnet publish src/Client/Neruna.Desktop -c Release -r win-x64 --self-contained true \
            -p:PublishReadyToRun=true -p:DebugType=none -p:Version="$VERSION" -o publish
          cp LICENSE publish/LICENSE.txt
          cp THIRD-PARTY-NOTICES.md publish/THIRD-PARTY-NOTICES.md

      - name: Package
        run: |
          dotnet tool install -g vpk --version "$VPK_VERSION"
          # The previous release, so the update can be a small delta.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            vpk download github --repoUrl "https://github.com/$GITHUB_REPOSITORY" --token "${{ secrets.GITHUB_TOKEN }}" \
              --channel win --pre --outputDir releases || echo "No previous release."
          fi
          vpk "[win]" pack --packId Neruna --packVersion "$VERSION" --packDir publish --mainExe neruna.exe \
            --packTitle Neruna --packAuthors Neruna --icon src/Client/Neruna.Desktop/Assets/app.ico --outputDir releases

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          vpk upload github --repoUrl "https://github.com/$GITHUB_REPOSITORY" --token "${{ secrets.GITHUB_TOKEN }}" \
            --channel win --outputDir releases --publish --pre --releaseName "Neruna $VERSION" --tag "v$VERSION"

  # Linux: an AppImage with the same automatic updates (channel "linux"). Built like the Windows one, on Linux.
  linux:
    needs: windows
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      AVALONIA_TELEMETRY_OPTOUT: 1
      VPK_VERSION: 1.2.161
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version from the tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "VERSION=0.1.0-test" >> "$GITHUB_ENV"; fi

      - name: Build
        run: |
          dotnet publish src/Client/Neruna.Desktop -c Release -r linux-x64 --self-contained true \
            -p:PublishReadyToRun=true -p:DebugType=none -p:Version="$VERSION" -o publish
          cp LICENSE publish/LICENSE.txt
          cp THIRD-PARTY-NOTICES.md publish/THIRD-PARTY-NOTICES.md

      - name: Package
        run: |
          sudo apt-get install -y squashfs-tools
          dotnet tool install -g vpk --version "$VPK_VERSION"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            vpk download github --repoUrl "https://github.com/$GITHUB_REPOSITORY" --token "${{ secrets.GITHUB_TOKEN }}" \
              --channel linux --pre --outputDir releases || echo "No previous release."
          fi
          vpk pack --packId Neruna --packVersion "$VERSION" --packDir publish --mainExe neruna --packTitle Neruna \
            --packAuthors Neruna --icon packaging/neruna.png --categories "Office;Email" --channel linux --outputDir releases

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          vpk upload github --repoUrl "https://github.com/$GITHUB_REPOSITORY" --token "${{ secrets.GITHUB_TOKEN }}" \
            --channel linux --outputDir releases --merge --publish --pre --releaseName "Neruna $VERSION" --tag "v$VERSION"

  # macOS: an app bundle and installer per processor (channels "osx-arm64", "osx-x64"); packing needs a Mac. Not signed
  # with a Developer ID yet: macOS asks once (right-click → Öffnen).
  macos:
    needs: linux
    # One runner for both packages, one after the other: macOS runners are scarce, and two jobs waiting for two of
    # them were cancelled again and again ("not acquired by Runner"); one that gets a runner now builds everything.
    # An Intel Mac: the arm64 runners were short ("capacity constraints") and cancelled almost every release; the
    # Apple silicon package is cross-compiled here just like the Intel one.
    runs-on: macos-15-intel
    env:
      DOTNET_NOLOGO: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      AVALONIA_TELEMETRY_OPTOUT: 1
      VPK_VERSION: 1.2.161
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version from the tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "VERSION=0.1.0-test" >> "$GITHUB_ENV"; fi

      - name: Build, package and publish (Apple silicon, then Intel)
        run: |
          set -euo pipefail
          dotnet tool install -g vpk --version "$VPK_VERSION"
          sed "s/__VERSION__/$VERSION/g" packaging/Info.plist > Info.plist
          for rid in osx-arm64 osx-x64; do
            echo "::group::$rid"
            dotnet publish src/Client/Neruna.Desktop -c Release -r "$rid" --self-contained true \
              -p:PublishReadyToRun=true -p:DebugType=none -p:Version="$VERSION" -o "publish-$rid"
            cp LICENSE "publish-$rid/LICENSE.txt"
            cp THIRD-PARTY-NOTICES.md "publish-$rid/THIRD-PARTY-NOTICES.md"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              vpk download github --repoUrl "https://github.com/$GITHUB_REPOSITORY" --token "${{ secrets.GITHUB_TOKEN }}" \
                --channel "$rid" --pre --outputDir "releases-$rid" || echo "No previous release."
            fi
            vpk pack --packId Neruna --packVersion "$VERSION" --packDir "publish-$rid" --mainExe neruna --packTitle Neruna \
              --packAuthors Neruna --icon packaging/neruna.icns --plist Info.plist \
              --channel "$rid" --outputDir "releases-$rid"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              vpk upload github --repoUrl "https://github.com/$GITHUB_REPOSITORY" --token "${{ secrets.GITHUB_TOKEN }}" \
                --channel "$rid" --outputDir "releases-$rid" --merge --publish --pre --releaseName "Neruna $VERSION" --tag "v$VERSION"
            fi
            echo "::endgroup::"
          done
